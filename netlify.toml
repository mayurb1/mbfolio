# Netlify configuration — Next.js (App Router) via @netlify/plugin-nextjs.
# The plugin turns Route Handlers / SSR / ISR into serverless functions and
# publishes the framework output.
[build]
  command = "npm run build"
  # Must be set explicitly: the site's UI publish setting points at the repo
  # root, which equals the base dir and makes @netlify/plugin-nextjs fail
  # ("publish directory cannot be the same as the base directory"). The config
  # file overrides the UI, so pin it to Next.js' build output.
  publish = ".next"

# Next.js 16 requires Node >= 20.9. Pin to 22 LTS so the build doesn't fall back
# to a stale site default (e.g. Node 18, which fails the build).
[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers live in next.config.mjs (single source — applies in dev and
# on any host; the Netlify adapter honors next.config `headers()`).

# Immutable, content-hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables are set in the Netlify dashboard, not here:
#   Server-only: MONGO_URI, JWT_SECRET, CLOUDINARY_CLOUD_NAME,
#                CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET, FRONTEND_URL
#   Client:      NEXT_PUBLIC_GA_ID, NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,
#                NEXT_PUBLIC_CONTACT_API_URL, NEXT_PUBLIC_FORMSPREE_FORM_ID
